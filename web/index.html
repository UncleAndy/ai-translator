<!DOCTYPE html>
<!--
  Экран перевода: страница большого экрана для приёмника «локальный WebSocket-сервер».

  Подключается к ws://<host>/ws и получает события перевода в виде JSON.

  Формат сообщений (задаётся приёмником, задача 10):
    перевод      {"line":0,"seq":12,"text":"привет мир","source_text":"hello world","is_final":true}
    состояние    {"line":0,"state":"running"}
  Поле source_text необязательно; seq монотонно растёт в пределах линии и
  используется для отбрасывания повторов после переподключения. Аудиопакеты
  перевода на страницу не отправляются.

  Клавиша F разворачивает страницу на весь экран, курсор прячется при простое.

  Размер текста задаёт приёмник и отдаёт странице скриптом /settings.js
  (window.TRANSLATOR_SETTINGS): line_size_vw — размер перевода в процентах
  ширины экрана, min_line_size_vw — предел ужимания длинной фразы. Во время
  перевода размер не меняется: ужимается он только тогда, когда фраза иначе
  не поместится. При открытии страницы как файла настройки не приходят и
  остаются значения по умолчанию.

  Заставка приходит оттуда же, полем poster: url картинки (приёмник отдаёт её по
  /poster и читает файл на каждый запрос), text_top и text_bottom — надписи над
  и под картинкой, timeout — сколько секунд без нового перевода ждать перед
  показом. Заставка видна сразу после открытия страницы, пока перевода ещё не
  было, и возвращается в каждой паузе; первый же перевод её убирает.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экран перевода</title>
<style>
  :root {
    --accent: #00ff66;
    --line-size: 4.5vw;
    /* Исходный текст идёт следом за переводом: своя доля от его размера. */
    --source-size: calc(var(--line-size) * 0.42);
    --bg: #050505;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 3vh 4vw;
    background: var(--bg);
    color: #fff;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  /* Экран целиком: сцена занимает всю высоту, текст стоит по её центру.
     Размер шрифта подбирается так, чтобы текст заполнял сцену, но не
     обрезался (см. fit()). */
  #stage {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }

  #lines {
    display: flex;
    flex-direction: column;
    /* Высота — по содержимому: иначе сцена обрезала бы текст и подбор размера
       (fit) сравнивал бы высоту не с тем, что нужно. */
    flex: none;
    gap: 2vh;
  }

  .phrase {
    display: flex;
    flex-direction: column;
    gap: 0.4vh;
  }

  .source {
    font-size: var(--source-size);
    font-weight: 400;
    line-height: 1.25;
    opacity: 0.45;
    overflow-wrap: anywhere;
  }

  .line {
    font-size: var(--line-size);
    font-weight: 600;
    line-height: 1.25;
    opacity: 0.35;
    overflow-wrap: anywhere;
    transition: opacity 0.3s ease, color 0.3s ease;
  }

  .phrase.active .line { opacity: 1; color: var(--accent); }
  .phrase.done .line { opacity: 0.8; color: #fff; }

  #status {
    position: fixed;
    top: 1.6vh;
    right: 2.4vw;
    font-size: clamp(12px, 1.1vw, 20px);
    letter-spacing: 0.04em;
    opacity: 0.55;
  }

  #status.off { color: #ff5c5c; opacity: 0.9; }

  /* Заставка: показывается, когда переводить нечего — до первого перевода и в
     паузах. Картинка по центру, надпись сверху и снизу страницы. */
  #poster {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 6vh 4vw;
    background: var(--bg);
    text-align: center;
  }

  #poster[hidden] { display: none; }

  .poster-text {
    font-size: clamp(18px, 2.6vw, 64px);
    font-weight: 600;
    line-height: 1.2;
    max-width: 92vw;
    overflow-wrap: anywhere;
    color: var(--accent);
  }

  #poster-bottom { color: #fff; opacity: 0.85; }

  #poster-image {
    max-width: 92vw;
    max-height: 66vh;
    object-fit: contain;
    border-radius: 1vmin;
  }

  /* Пустой текст не должен съедать место у картинки. */
  .poster-text:empty { display: none; }
</style>
</head>
<body>
<div id="status" class="off">подключение…</div>
<main id="stage"><div id="lines"></div></main>
<div id="poster" hidden>
  <div id="poster-top" class="poster-text"></div>
  <img id="poster-image" alt="">
  <div id="poster-bottom" class="poster-text"></div>
</div>
<!-- Настройки показа отдаёт приёмник (ScreenSettings в sink/text/websocket.rs).
     Когда страница открыта как файл, скрипт не загружается и остаются значения
     по умолчанию из кода ниже. -->
<script src="/settings.js"></script>
<script>
"use strict";

const MAX_LINES = 3;
const RECONNECT_MS = 1500;

/* Размер текста приходит из настроек приёмника и во время перевода не меняется.
   Значения ниже — то же самое, что приёмник отдаёт по умолчанию. */
const DEFAULTS = { line_size_vw: 4.5, min_line_size_vw: 2.0 };
const configured = (window.TRANSLATOR_SETTINGS && typeof window.TRANSLATOR_SETTINGS === "object")
  ? window.TRANSLATOR_SETTINGS
  : {};

function setting(name) {
  const value = Number(configured[name]);
  return Number.isFinite(value) && value > 0 ? value : DEFAULTS[name];
}

const BASE_LINE_SIZE = setting("line_size_vw");
const MIN_LINE_SIZE = setting("min_line_size_vw");
const LINE_STEP = 0.25;

/* Заставка. Приёмник отдаёт её вместе с настройками, когда в конфигурации задана
   картинка: url картинки, надписи сверху и снизу и время простоя в секундах,
   после которого заставка появляется. */
const POSTER = (configured.poster && typeof configured.poster === "object") ? configured.poster : null;
/* Пауза, после которой заставка уместна при timeout = 0: иначе она мигала бы
   между соседними словами идущего перевода. */
const POSTER_MIN_MS = 500;
const POSTER_CHECK_MS = 250;

const posterEl = document.getElementById("poster");
const posterTopEl = document.getElementById("poster-top");
const posterBottomEl = document.getElementById("poster-bottom");
const posterImageEl = document.getElementById("poster-image");

/* Когда пришёл последний перевод. Ноль означает, что перевода ещё не было:
   тогда заставка показывается сразу, как только страница открылась. */
let lastTranslationAt = 0;

const posterTimeoutMs = POSTER
  ? Math.max(0, Number(POSTER.timeout) || 0) * 1000 || POSTER_MIN_MS
  : 0;

function setupPoster() {
  if (!POSTER) return;

  posterTopEl.textContent = typeof POSTER.text_top === "string" ? POSTER.text_top : "";
  posterBottomEl.textContent = typeof POSTER.text_bottom === "string" ? POSTER.text_bottom : "";
  if (typeof POSTER.url === "string" && POSTER.url.length > 0) {
    posterImageEl.src = POSTER.url;
  }
  refreshPoster();
}

function refreshPoster() {
  if (!POSTER) {
    posterEl.hidden = true;
    return;
  }

  const idle = Date.now() - lastTranslationAt;
  posterEl.hidden = idle < posterTimeoutMs;
}

const stageEl = document.getElementById("stage");
const linesEl = document.getElementById("lines");
const statusEl = document.getElementById("status");

let current = null;

function setStatus(text, broken) {
  statusEl.textContent = text;
  statusEl.classList.toggle("off", Boolean(broken));
}

const STATE_LABELS = {
  created: "линия создана",
  starting: "запуск провайдера…",
  running: "на связи",
  stopped: "перевод остановлен",
  failed: "сбой провайдера",
};

function setLineSize(vw) {
  document.documentElement.style.setProperty("--line-size", vw + "vw");
}

/* Поставить размер текста из настроек.
 *
 * Размер постоянный: подстраивать его под каждую фразу нельзя, иначе текст
 * «дышит» во время перевода. Ужимаемся только тогда, когда фраза иначе не
 * поместится на экран, и не ниже предела из настроек.
 */
function fit() {
  let size = BASE_LINE_SIZE;
  setLineSize(size);

  while (size > MIN_LINE_SIZE && linesEl.scrollHeight > stageEl.clientHeight) {
    size -= LINE_STEP;
    setLineSize(size);
  }
}

function trim() {
  while (linesEl.children.length > MAX_LINES) {
    linesEl.removeChild(linesEl.firstChild);
  }
}

function startPhrase() {
  const phrase = document.createElement("div");
  phrase.className = "phrase active";

  const line = document.createElement("div");
  line.className = "line";
  line.textContent = "…";

  phrase.appendChild(line);
  linesEl.appendChild(phrase);
  trim();
  setLineSize(BASE_LINE_SIZE);

  current = phrase;
  return phrase;
}

function sourceOf(phrase) {
  let source = phrase.querySelector(".source");
  if (!source) {
    source = document.createElement("div");
    source.className = "source";
    phrase.insertBefore(source, phrase.firstChild);
  }
  return source;
}

/* Фраза завершена: приглушить её и начать следующую. */
function releasePhrase() {
  if (current) {
    current.classList.remove("active");
    current.classList.add("done");
    current = null;
  }
  setLineSize(BASE_LINE_SIZE);
}

const lastSeq = new Map(); // линия → последний показанный номер события

function onTranslation(message) {
  const line = message.line ?? 0;

  if (typeof message.seq === "number") {
    if (message.seq <= (lastSeq.get(line) ?? -1)) return; // повтор после переподключения
    lastSeq.set(line, message.seq);
  }

  // Пришёл новый перевод — заставке здесь не место.
  lastTranslationAt = Date.now();
  refreshPoster();

  // Текст финального события относится к завершаемой фразе, поэтому сначала
  // записываем его в текущую фразу и только потом отпускаем её.
  const phrase = current || startPhrase();
  phrase.querySelector(".line").textContent = message.text;

  if (typeof message.source_text === "string" && message.source_text.length > 0) {
    sourceOf(phrase).textContent = message.source_text;
  }

  if (message.is_final) releasePhrase();

  fit();
}

function onEvent(message) {
  if (typeof message.state === "string") {
    setStatus(STATE_LABELS[message.state] || message.state, message.state === "failed");
    return;
  }

  if (typeof message.text === "string") onTranslation(message);
}

function connect() {
  const scheme = location.protocol === "https:" ? "wss:" : "ws:";
  const host = location.host || "127.0.0.1:8642"; // страница открыта как файл
  const ws = new WebSocket(scheme + "//" + host + "/ws");

  ws.onopen = () => setStatus("на связи", false);

  ws.onmessage = (event) => {
    try {
      onEvent(JSON.parse(event.data));
    } catch (error) {
      console.warn("не разобрано сообщение", error);
    }
  };

  ws.onerror = () => setStatus("ошибка связи", true);

  ws.onclose = () => {
    setStatus("связь потеряна, переподключение…", true);
    setTimeout(connect, RECONNECT_MS);
  };
}

document.addEventListener("keydown", (event) => {
  if (event.key === "f" || event.key === "F" || event.key === "а" || event.key === "А") {
    document.documentElement.requestFullscreen?.();
  }
});

// Смена разрешения или выход на весь экран меняют сцену — размер подбираем заново.
window.addEventListener("resize", fit);

let idleTimer = null;
document.addEventListener("mousemove", () => {
  document.body.style.cursor = "";
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { document.body.style.cursor = "none"; }, 5000);
});

setupPoster();
setInterval(refreshPoster, POSTER_CHECK_MS);

connect();
</script>
</body>
</html>
