name: release

# A tag starts the whole thing: build on each platform, then attach the
# artefacts to a draft release, which is published by hand.
on:
  push:
    tags:
      - "v*"

# Read only: the workflow builds and stores the artefacts, the release is
# created by hand.
permissions:
  contents: read

jobs:
  linux:
    # 24.04 rather than 22.04: libspa-sys generates its bindings from the system
    # PipeWire headers and needs PipeWire 1.0, while 22.04 ships 0.3.48 and the
    # build fails. The glibc floor of the result is 2.34 either way.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-translator
      # ai-translator depends on transono by path, so both trees are checked out
      # side by side, exactly like the ci workflow does.
      - uses: actions/checkout@v4
        with:
          repository: UncleAndy/transono
          path: transono
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libasound2-dev libclang-dev pkg-config file
      - uses: dtolnay/rust-toolchain@stable
      # nfpm writes both the .deb and the .rpm and no distribution packages it.
      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.tgz "https://github.com/goreleaser/nfpm/releases/download/v2.46.3/nfpm_2.46.3_Linux_x86_64.tar.gz"
          sudo tar -xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
      - name: Build the artefacts
        working-directory: ai-translator
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          test "$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)" = "$VERSION" \
            || { echo "tag $TAG does not match the version in Cargo.toml"; exit 1; }
          bash packaging/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: ai-translator/dist/*
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-translator
      - uses: actions/checkout@v4
        with:
          repository: UncleAndy/transono
          path: transono
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the artefacts
        working-directory: ai-translator
        env:
          TAG: ${{ github.ref_name }}
          AIT_TARGET: ${{ matrix.target }}
        run: |
          VERSION="${TAG#v}"
          test "$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)" = "$VERSION" \
            || { echo "tag $TAG does not match the version in Cargo.toml"; exit 1; }
          bash packaging/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: ai-translator/dist/*
          if-no-files-found: error

  bundle:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      # Everything worth downloading in one place. The release itself is made by
      # hand: the workflow never touches the releases API and needs no write
      # permission.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
