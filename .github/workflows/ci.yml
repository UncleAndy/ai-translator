name: ci

on:
  push:
  pull_request:
  # Manual runs exist for one reason: to take the Windows package out of the
  # build when no Windows machine is at hand. Only then is the artefact kept,
  # and it is not a release file.
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-translator
      # The dependency on transono is a path dependency (../transono), so the
      # sibling checkout has to sit next to this repository.
      - uses: actions/checkout@v4
        with:
          repository: UncleAndy/transono
          path: transono
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libasound2-dev libclang-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        working-directory: ai-translator
        run: cargo fmt --check
      - name: clippy
        working-directory: ai-translator
        run: cargo clippy --all-targets -- -D warnings
      - name: tests
        working-directory: ai-translator
        run: cargo test
      - name: display page logic
        working-directory: ai-translator
        run: node web/test/page.mjs
      - name: macOS must not pull PipeWire
        working-directory: ai-translator
        run: |
          ! cargo tree --target aarch64-apple-darwin -e normal --prefix none \
            | grep -qE '^(pipewire|pipewire-sys|libspa|libspa-sys)'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-translator
      - uses: actions/checkout@v4
        with:
          repository: UncleAndy/transono
          path: transono
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        working-directory: ai-translator
        run: cargo fmt --check
      - name: clippy
        working-directory: ai-translator
        run: cargo clippy --all-targets -- -D warnings
      - name: tests
        working-directory: ai-translator
        run: cargo test
      # The media engine is a native MSVC library: fetching it and building the
      # feature is the only place where the Windows link is actually exercised.
      - name: voice-chat sink with the engine
        working-directory: ai-translator
        shell: pwsh
        run: |
          $engine = ./packaging/fetch-ntgcalls.ps1
          $env:NTGCALLS_DYLIB = '1'
          $env:NTGCALLS_LIB_DIR = $engine.LibDir
          cargo build --features telegram-call
      # A package nobody can produce is not a release: build the ZIP and the MSI.
      - name: portable package and installer
        working-directory: ai-translator
        shell: pwsh
        run: |
          ./packaging/build-windows.ps1 -SkipTests
          $files = Get-ChildItem dist/ai-translator-*-x86_64-windows.*
          foreach ($name in @('*.zip', '*.msi')) {
            if (-not (Get-ChildItem "dist/$name")) { throw "no $name was produced" }
          }
          $files | Format-Table Name, Length
      # Only a manual run keeps the file: with no Windows machine at hand, this
      # is how the package gets out. It expires by itself and never reaches the
      # repository or a release.
      - name: keep the package for a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ai-translator-windows-x86_64
          path: |
            ai-translator/dist/ai-translator-*-x86_64-windows.zip
            ai-translator/dist/ai-translator-*-x86_64-windows.zip.sha256
            ai-translator/dist/ai-translator-*-x86_64-windows.msi
            ai-translator/dist/ai-translator-*-x86_64-windows.msi.sha256
          if-no-files-found: error
          retention-days: 90

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-translator
      - uses: actions/checkout@v4
        with:
          repository: UncleAndy/transono
          path: transono
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        working-directory: ai-translator
        run: cargo fmt --check
      - name: clippy
        working-directory: ai-translator
        run: cargo clippy --all-targets -- -D warnings
      - name: tests
        working-directory: ai-translator
        run: cargo test
