# Самая короткая конфигурация: только язык перевода. Всё остальное имеет
# значения по умолчанию, и вот какие:
#
#   core.provider      = "openai/translation"   — синхронный переводчик
#   core.source_lang   = "auto"                 — язык определяется на слух
#   core.target_lang   = "en"                   — английский, если не сказано иначе
#   core.input_device  = "default"              — системный микрофон
#   core.output_device = "default"              — системные динамики
#   приёмники          = терминал               — без [sink] перевод печатается
#
# Опечатка в имени поля — не молчаливый переход к значению по умолчанию, а
# ошибка разбора: `check` назовёт поле и перечислит допустимые.
#
# Полный перечень всех параметров с комментариями — в config.all.toml.

[core]
target_lang = "ru"
