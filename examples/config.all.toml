# Полный справочник параметров: здесь перечислены все поля конфигурации и их
# значения по умолчанию. Это не рабочий сценарий, а образец — скопируйте файл,
# включите нужные приёмники и поправьте значения.
#
# Проверить файл, ничего не запуская:
#
#   ai-translator check --config examples/config.all.toml
#
# Все приёмники, кроме консоли, выключены: так проверка проходит без ключа
# провайдера, свободных портов и звукового оборудования. Ключ провайдера
# берётся из переменной окружения OPENAI_API_KEY или из файла .env рядом с
# конфигурацией.

[core]
# Провайдер перевода. Сейчас поддерживается только синхронный перевод OpenAI:
# он сам распознаёт речь и возвращает перевод.
provider = "openai/translation"
# Язык источника. auto — определять по речи.
source_lang = "auto"
# Язык перевода. Обязательное поле: пустое значение проверка отвергает.
target_lang = "ru"
# Устройство захвата звука. default — системное по умолчанию; другие имена
# печатает команда `ai-translator devices`.
input_device = "default"
# Голос синтеза речи у провайдера. Зарезервировано под провайдер реального
# времени: синхронный перевод звук не синтезирует и поле не читает.
# voice = "alloy"
# Модель распознавания речи. Тоже только для провайдера реального времени:
# синхронный перевод распознаёт речь сам.
# transcription_model = "whisper-1"


# ─── Текстовые приёмники ──────────────────────────────────────────────────────
# Приёмников одного типа может быть несколько: каждый блок [[sink.text]]
# добавляет ещё один. Порядок в файле на работу не влияет.

# Консоль: текущий перевод в терминале.
[[sink.text]]
type = "console"
enabled = true

# Страница большого экрана: локальный веб-сервер отдаёт страницу и шлёт в неё
# перевод по WebSocket. Открывается по адресу http://<адрес>:<порт>/
[[sink.text]]
type = "websocket"
enabled = false
# Адрес прослушивания. 0.0.0.0 — со всех интерфейсов, 127.0.0.1 — только с
# этой машины.
bind = "0.0.0.0:8642"
# Размер перевода в процентах ширины экрана. Во время перевода не меняется.
line_size_vw = 4.5
# Нижняя граница, до которой размер уменьшается, если длинная фраза не
# помещается. Больше нуля и не больше line_size_vw.
min_line_size_vw = 2.0

# Транскрипт: перевод (и при bilingual — исходный текст) пишется в файл.
[[sink.text]]
type = "transcript"
enabled = false
# Путь к файлу; относительный считается от текущего каталога.
path = "transcript.txt"
# Формат записи: txt — текст, srt и vtt — субтитры, jsonl — по событию в
# строке.
format = "txt"
# Писать рядом с переводом исходный текст.
bilingual = false

# Телеграм: перевод уходит в канал через бота. Первая ревизия фразы сразу
# создаёт сообщение, следующие дописывают его правками — так в канале виден ход
# фразы, а не пачка почти одинаковых сообщений. Фраза кончилась — сообщение
# остаётся готовой строкой, следующая фраза начинает новое. Правки идут не чаще
# раза в 1.2 с (лимит Telegram), последняя ревизия применяется всегда.
# Сообщение — простой текст без разметки; фраза длиннее 4096 символов
# продолжается в следующем сообщении.
[[sink.text]]
type = "telegram"
enabled = false
# Канал для публикации: @имя или числовой id (например, -1001234567890).
# Бот должен быть администратором канала с правом публикации.
chat_id = "@my_channel"
# Имя переменной окружения с токеном бота (его выдаёт @BotFather). Проверка
# требует, чтобы переменная была задана.
token_env = "TELEGRAM_BOT_TOKEN"
# Отправлять исходный текст строкой выше перевода.
bilingual = false
# Без звука уведомления.
silent = false
# Пределы скорости, в которые укладывается публикация:
#   max_sends_per_minute — не больше 20 новых сообщений в минуту;
#   edit_interval_ms     — не чаще одной правки сообщения в секунду.
# 0 в любом поле снимает этот предел целиком.
max_sends_per_minute = 20
edit_interval_ms = 1000
# Тема форума: id темы, если канал привязан к форуму. Обычному каналу не нужно.
# message_thread_id = 12

# Вебхук: перевод уходит во внешнюю систему HTTP-запросом. На этом этапе
# приёмник объявлен и проверяется, но отправку ещё не делает.
[[sink.text]]
type = "webhook"
enabled = false
# Адрес приёмника. Проверка требует, чтобы он начинался с http.
url = "http://127.0.0.1:8080/translate"
# Тело запроса. Подстановки: {text} — перевод, {source_text} — исходный текст,
# {is_final} — признак последнего варианта фразы, {seq} — номер события,
# {target_lang} — язык перевода.
body_template = '{"text": "{text}", "final": {is_final}, "lang": "{target_lang}"}'
# Имя переменной окружения с токеном доступа. Если поле указано, проверка
# требует, чтобы переменная была задана; пустое поле — без токена.
token_env = "WEBHOOK_TOKEN"


# ─── Голосовые приёмники ─────────────────────────────────────────────────────

# Виртуальное звуковое устройство: переведённая речь уходит в него, а не в
# колонки, чтобы её мог забрать другой процесс (стрим, запись). Заготовка
# следующего этапа.
[[sink.voice]]
type = "virtual_sink"
enabled = false
# Имя устройства вывода из `ai-translator devices`. Пустое значение проверка
# отвергает.
device = "ai-translator"
# Громкость оригинала в мониторе, от 0.0 до 1.0: 0.0 — оригинала не слышно,
# 1.0 — слышно как есть. Значение вне диапазона — ошибка.
monitor_original = 0.0
