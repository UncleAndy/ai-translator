[package]
name = "ai-translator"
version = "0.2.5"
edition = "2024"
authors = ["Andrey Velikoredchanin"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/uncleandy/ai-translator"
homepage = "https://github.com/uncleandy/ai-translator"
readme = "README.md"
keywords = ["translation", "speech", "audio", "ai", "realtime"]
categories = ["multimedia::audio", "api-bindings"]

[features]
default = []
# Live audio into a Telegram group call (a voice chat), through a user account.
# It needs a native media engine, and only the targets that ship one enable it:
# Linux x86_64, Linux arm64 and macOS arm64. Every other target is built without
# the feature, keeps the pure-Rust dependency set, and rejects the sink in the
# configuration with an explanation instead of failing at run time.
telegram-call = [
    "dep:ntgcalls",
    "dep:grammers-client",
    "dep:grammers-mtsender",
    "dep:grammers-session",
    "dep:grammers-tl-types",
    "dep:rpassword",
]

[dependencies]
# The library is developed next to the application, so it is taken from the
# tree; the version is the one this build expects, including the Windows-ready
# 0.5.1 with a working device backend stub.
transono = { path = "../transono", version = "0.5.1" }
# Список устройств для команды `devices`: имена берутся из того же бэкенда,
# из которого выбирает источник звука (версия та же, что у transono).
cpal = "0.18"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "fs", "io-std", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# HTTP client of the Telegram sink. rustls instead of the platform TLS stack:
# the release binaries are built in a container, and rustls needs no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Media engine of the Telegram voice-chat sink: a native WebRTC/DTLS-SRTP library,
# hence optional and reachable only through the `telegram-call` feature. The
# library itself (a static build for the target) is downloaded by its own build
# script and linked into the binary, so nothing has to be shipped beside it.
ntgcalls = { version = "3.0.4", optional = true }
# MTProto side of the same sink: the account signs in once, and the phone.* methods
# that create and join a voice chat are called through these crates.
grammers-client = { version = "0.11", optional = true }
grammers-mtsender = { version = "0.11", optional = true }
grammers-session = { version = "0.11", optional = true }
grammers-tl-types = { version = "0.11", optional = true }
# The two-factor password is typed without echo.
rpassword = { version = "7", optional = true }

[dev-dependencies]
tempfile = "3"
# The audio spec of the probe comes from the same crate transono uses.
symphonia = "0.6"

[patch.crates-io]
# The engine is loaded as a shared library, and the upstream build script emits
# GNU linker options in that mode. ld64, the macOS linker, rejects them, so the
# crate is vendored with a build script that speaks to each linker in its own
# language.
ntgcalls-sys = { path = "vendor/ntgcalls-sys" }
