[package]
name = "ai-translator"
version = "0.1.0"
edition = "2024"
authors = ["Andrey Velikoredchanin"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/uncleandy/ai-translator"
homepage = "https://github.com/uncleandy/ai-translator"
readme = "README.md"
keywords = ["translation", "speech", "audio", "ai", "realtime"]
categories = ["multimedia::audio", "api-bindings"]

[dependencies]
transono = { path = "../transono" }
# Список устройств для команды `devices`: имена берутся из того же бэкенда,
# из которого выбирает источник звука (версия та же, что у transono).
cpal = "0.18"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-std", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
tempfile = "3"
